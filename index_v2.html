
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Map</title>

<style>
body{
margin:0;
background:#08161b;
font-family:Arial,sans-serif;
padding:20px;
color:white;
}

.map-wrap{
position:relative;
width:min(1600px,100%);
margin:auto;
}

.svg-container img{
width:100%;
height:auto;
display:block;
border-radius:18px;
}

.overlay{
position:absolute;
inset:0;
}

.hotspot{
position:absolute;
transform:translate(-50%,-50%);
z-index:1;
}

.hotspot:hover{
z-index:9999;
}

.marker{
width:11px;
height:11px;
border-radius:50%;
background:#ff3030;
border:1.5px solid white;
box-shadow:0 0 20px rgba(255,0,0,.45);
}

.label{
z-index:10000;
position:absolute;
top:-18px;
left:18px;
background:black;
color:white;
padding:5px 8px;
border-radius:5px;
font-size:11px;
font-weight:700;
white-space:nowrap;
opacity:0;
pointer-events:none;
}

.tooltip{
z-index:10001;
position:absolute;
top:10px;
left:18px;
width:260px;
background:rgba(15,15,15,.96);
color:white;
padding:12px;
border-radius:10px;
font-size:12px;
line-height:1.5;
opacity:0;
pointer-events:none;
border:1px solid rgba(255,255,255,.08);
}

.marker:hover + .label,
.marker:hover + .label + .tooltip{
opacity:1;
}
</style>
</head>

<body>

<div class="map-wrap">

<div class="svg-container">
<img src="map_v2.svg" alt="Map">
</div>

<div class="overlay">

<div class="hotspot" style="left:69%; top:41%;">
<div class="marker"></div>
<div class="label">CHINA</div>
<div class="tooltip">
Origin & dominant global processor of nearly all critical minerals
</div>
</div>

</div>

</div>

</body>
</html>
